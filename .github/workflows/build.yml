name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            config: -A x64
          - name: macOS
            os: macos-14
            config: -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Linux
            os: ubuntu-24.04
            config: -DPATINA_BUILD_TESTS=ON

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.config }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Host test
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./build/tools/PatinaHostTest_artefacts/Release/PatinaHostTest \
            build/Patina_artefacts/Release/VST3/Patina.vst3

      - name: pluginval
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --skip-gui-tests --validate build/Patina_artefacts/Release/VST3/Patina.vst3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Patina-${{ matrix.name }}-VST3
          path: build/Patina_artefacts/Release/VST3/Patina.vst3

      - name: Upload AU
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Patina-macOS-AU
          path: build/Patina_artefacts/Release/AU/Patina.component
